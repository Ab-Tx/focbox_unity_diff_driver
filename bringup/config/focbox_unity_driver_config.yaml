controller_manager:
  ros__parameters:
    update_rate: 10  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    diffbot_base_controller:
      type: diff_drive_controller/DiffDriveController


focbox_unity_driver:
  ros__parameters:
    left_wheel_names: ["left_wheel_joint"]
    right_wheel_names: ["right_wheel_joint"]

    wheel_separation : 0.465
    wheel_radius : 0.0875

    wheel_separation_multiplier: 1.0
    left_wheel_radius_multiplier: 1.0
    right_wheel_radius_multiplier: 1.0

    publish_rate: 50.0               # default: 50
    odom_frame_id: odom
    base_frame_id: base_footprint #default: base_link
    pose_covariance_diagonal : [0.001, 0.001, 1000000.0, 1000000.0, 1000000.0, 1000.0]
    twist_covariance_diagonal: [0.001, 0.001, 1000000.0, 1000000.0, 1000000.0, 1000.0]

    open_loop: true
    enable_odom_tf: true

    # Velocity commands timeout [s], default 0.5
    cmd_vel_timeout: 10
    #publish_limited_velocity: true
    use_stamped_vel: false
    #velocity_rolling_window_size: 10

    # Velocity and acceleration limits
    # Whenever a min_* is unspecified, default to -max_*
    linear.x.has_velocity_limits: false
    linear.x.has_acceleration_limits: false
    linear.x.has_jerk_limits: false
    linear.x.max_velocity: 1.0
    linear.x.min_velocity: -0.5 # -1.0
    linear.x.max_acceleration: 0.8  # m/s^2
    linear.x.max_jerk: 5.0  # m/s^3
    linear.x.min_jerk: 0.0

    angular.z.has_velocity_limits: false
    angular.z.has_acceleration_limits: false
    angular.z.has_jerk_limits: false
    angular.z.max_velocity: 1.7  # rad/s
    angular.z.min_velocity: -1.0
    angular.z.max_acceleration: 1.5  # rad/s^2
    angular.z.min_acceleration: -1.0
    angular.z.max_jerk: 2.5  # rad/s^3
    angular.z.min_jerk: 0.0

  # parameters used in the driver
  motor_parameters:
    counts: 90.0
    pole_pairs: 15.0

